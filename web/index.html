<!DOCTYPE html>
<html lang="en-AU">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Mosaic by MPC Markets - Stage 1 interactive mobile demo. Fictional data only.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B2545">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mosaic">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Mosaic by MPC Markets - Demo</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0B2545; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0B2545, #13315C 55%, #1F4E8C); font-family: -apple-system, "Segoe UI", Inter, sans-serif; color: #fff; transition: opacity .3s; }
    #splash .mark { width: 64px; height: 64px; border-radius: 17px; background: linear-gradient(135deg, #C9A266, #7A5A26);
      display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 34px; }
    #splash h1 { font-size: 30px; margin: 22px 0 2px; letter-spacing: -0.8px; }
    #splash p { margin: 0; color: #C9A266; font-weight: 600; font-size: 14px; letter-spacing: .4px; }
    #splash .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.15); margin-top: 28px; overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%; background: #C9A266; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar i { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading Mosaic">
    <div class="mark">M</div>
    <h1>Mosaic</h1>
    <p>by MPC Markets</p>
    <div class="bar"><i></i></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 320); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
